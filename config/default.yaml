# deepseek-proxy 默认配置
# 敏感信息（API Key 等）请通过环境变量配置，见 .env.example

server:
  port: 3000
  host: "0.0.0.0"

# 认证 — 单 Key 模式（设置环境变量 DP_PROXY_API_KEY 即可）
auth:
  # 多 Key 模式（可选），key_hash 用 bcrypt
  keys: []

# 模型名称双向翻译表
model_mapping:
  "claude-opus-4-20250514":
    provider: deepseek
    model: deepseek-v4-pro
  "claude-sonnet-4-20250514":
    provider: deepseek
    model: deepseek-v4-flash
  "claude-haiku-4-5-20251001":
    provider: deepseek
    model: deepseek-v4-flash
  default:
    provider: deepseek
    model: deepseek-v4-flash

# 速率限制
rate_limit:
  enabled: true
  requests_per_minute: 60
  concurrency: 10

# 供应商配置
providers:
  deepseek:
    base_url: "https://api.deepseek.com/anthropic"
    timeout_ms: 120000

# 插件配置
plugins:
  vision:
    enabled: false
    model: gpt-4o
    max_tokens: 4096
    # URL 和 API Key 通过 .env 配置:
    #   DP_VISION_BASE_URL=「见下方各厂商示例」
    #   DP_VISION_MODEL=gpt-4o
    #   DP_VISION_API_KEY=sk-xxx
    #
    # 各厂商 OpenAI 兼容接口示例:
    #   阿里百炼:    DP_VISION_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1  DP_VISION_MODEL=qwen-vl-max
    #   火山引擎:    DP_VISION_BASE_URL=https://ark.cn-beijing.volces.com/api/v3             DP_VISION_MODEL=doubao-vision-pro-32k
    #   硅基流动:    DP_VISION_BASE_URL=https://api.siliconflow.cn/v1                       DP_VISION_MODEL=Qwen/Qwen2.5-VL-72B-Instruct
    #   MiniMax:     DP_VISION_BASE_URL=https://api.minimax.chat/v1                         DP_VISION_MODEL=abab7-chat
    #   智谱 GLM:    DP_VISION_BASE_URL=https://open.bigmodel.cn/api/paas/v4                DP_VISION_MODEL=glm-4v
    #   Moonshot:    DP_VISION_BASE_URL=https://api.moonshot.cn/v1                          DP_VISION_MODEL=moonshot-v1-8k-vision
    #   OpenAI:      DP_VISION_BASE_URL=https://api.openai.com/v1                           DP_VISION_MODEL=gpt-4o
  search:
    enabled: false
    provider: tavily

# 日志
logging:
  level: info
